[project]
name = "miskatron"
version = "0.1.0"
description = "CLI toolset for managing and generating ebooks in the eldritch.press repository"
authors = [
	{ name = "Isaac Halvorson", email = "hello@hisaac.net" }
]
requires-python = ">=3.15"
dependencies = [
    "jinja2>=3.1.6",
    "pypandoc>=1.17",
    "pyyaml>=6.0.3",
]

[project.scripts]
msk = "miskatron.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["miskatron", "miskatron.commands", "miskatron.formats", "miskatron.templates", "miskatron.styles"]

[tool.setuptools.package-dir]
"miskatron.templates" = "templates"
"miskatron.styles" = "styles"

[tool.setuptools.package-data]
"miskatron.formats" = [".prettierrc.yaml"]
"miskatron.templates" = ["*.html", "*.typst"]
"miskatron.styles" = ["*.css"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[dependency-groups]
dev = [
	"pytest>=9.2.0",
	"ruff>=0.17.5",
	"ty>=0.0.106",
]
