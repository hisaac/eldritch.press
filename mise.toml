[settings]
activate_aggressive = true
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[settings.python]
uv_venv_auto = false

[bootstrap.packages]
"brew:pango" = { os = "macos" }
"apt:libpango-1.0-0" = { os = "linux" }
"apt:libpangoft2-1.0-0" = { os = "linux" }
"apt:libharfbuzz-subset0" = { os = "linux" }

[tools]
prettier = "latest"
ruff = "latest"
ty = "latest"
uv = "latest"

[env]
_.path = ["cli/.venv/bin"]
DYLD_FALLBACK_LIBRARY_PATH = "/opt/homebrew/lib{% if env.DYLD_FALLBACK_LIBRARY_PATH %}:{{ env.DYLD_FALLBACK_LIBRARY_PATH }}{% endif %}"

[deps.uv]
auto = true
dir = "cli"

[hooks]
postinstall = "mise deps install"

[tasks.build]
description = "Build all stories and their index"
run = "msk build"

[tasks.dist]
description = "Build the distribution website and EPUBs in .dist/"
run = "msk dist"

[tasks.check]
alias = "chk"
depends = ["lint", "typecheck", "test"]

[tasks.fix]
alias = "format"
run = ["mise fmt", "ruff format ."]

[tasks.lint]
run = ["mise fmt --check", "ruff check .", "ruff format --check ."]

[tasks.typecheck]
run = "ty check --project cli"

[tasks.test]
description = "Run the Python tests"
run = "pytest cli/tests"

[tasks.run]
run = "msk"

[tasks.clean]
description = "Remove generated EPUBs, build output, and coverage reports"
run = [
  "rm -rf .build .dist htmlcov",
  "rm -f .coverage .coverage.* coverage.xml",
]

[tasks.nuke]
description = "Clean generated output and delete all Git-ignored files (including .env)"
depends = ["clean"]
run = "git clean -dX --force"
