[settings]
activate_aggressive = true
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[settings.python]
uv_venv_auto = false

[tools]
pandoc = "latest"
prettier = "latest"
ruff = "latest"
ty = "latest"
typst = "latest"
uv = "latest"

[env]
_.path = ["cli/.venv/bin"]

[deps.uv]
auto = true
dir = "cli"

[hooks]
postinstall = "mise deps install"

[task_config]
includes = ["mise-tasks.toml"]
