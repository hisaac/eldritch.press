[settings]
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = "source"

[tools]
prettier = "latest"
ruff = "latest"
ty = "latest"
uv = "latest"

[bootstrap.packages]
"brew:pango" = { os = "macos" }

[env]
DYLD_FALLBACK_LIBRARY_PATH = "{% if os() == 'macos' %}/opt/homebrew/lib{% if env.DYLD_FALLBACK_LIBRARY_PATH %}:{% endif %}{% endif %}{{ env.DYLD_FALLBACK_LIBRARY_PATH | default(value='') }}"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[hooks]
postinstall = "mise run sync"

[tasks.bootstrap]
alias = "sync"
run = [
  """
case "$(uname -s)" in
  Darwin) mise bootstrap packages apply --yes brew:pango ;;
  Linux) mise bootstrap packages apply --yes apt:libpango-1.0-0 apt:libpangoft2-1.0-0 apt:libharfbuzz-subset0 apt:fonts-dejavu-core ;;
esac
""",
  "uv sync",
]

[tasks.build]
description = "Build all stories and their index"
run = "uv run msk build ./src/stories/"

[tasks.dist]
description = "Build the distribution website and EPUBs in dist/"
run = "uv run msk dist"

[tasks.check]
alias = "chk"
depends = ["lint", "typecheck", "test"]

[tasks.fix]
alias = "format"
run = ["mise fmt", "uv run ruff format ."]

[tasks.lint]
run = [
  "mise fmt --check",
  "uv run ruff check .",
  "uv run ruff format --check .",
]

[tasks.typecheck]
run = "uv run ty check"

[tasks.test]
description = "Run the Python tests"
run = "uv run pytest"

[tasks.run]
run = "uv run msk"

[tasks.clean]
description = "Remove generated EPUBs, build output, and coverage reports"
run = ["rm -rf build dist htmlcov", "rm -f .coverage .coverage.* coverage.xml"]

[tasks.nuke]
description = "Clean generated output and delete all Git-ignored files (including .env)"
depends = ["clean"]
run = "git clean -dX --force"
