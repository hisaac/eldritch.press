<!doctype html>
<html lang="{{ story.language }}">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{ story.title }}</title>
		<meta name="author" content="{{ story.author }}" />
		<link rel="stylesheet" href="story.css" />
	</head>
	<body>
		<main>
			<nav aria-label="Story navigation">
				<a href="../../index.html">Eldritch Press</a>
			</nav>
			<header>
				<h1>{{ story.title }}</h1>
				<p class="byline">by {{ story.author }}</p>
				<p><a href="{{ epub_href }}" download>Download EPUB</a></p>
				{%- if has_cover -%}
				<img class="cover" src="cover.png" alt="Cover of {{ story.title }}" />
				{%- endif -%}
			</header>
			{{ content.rstrip('\n') | safe }}
		</main>
	</body>
</html>
